<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Profile | VeloNow</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .profile-container {
            max-width: 600px;
            margin: 120px auto;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .profile-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .profile-info {
            display: grid;
            gap: 20px;
            margin-bottom: 40px;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
        }
        .info-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
        }
        .info-value {
            font-weight: 600;
        }
        .role-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 800;
        }
        .role-free { background: #666; }
        .role-subscriber { background: #ffd700; color: #000; }
        .role-admin { background: #ff4d4d; }
        .upgrade-card {
            background: linear-gradient(135deg, #1a1a1a 0%, #333 100%);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo" onclick="location.href='index.html'" style="cursor: pointer;">VeloNow<span>.</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li id="auth-nav"></li>
        </ul>
    </nav>

    <div class="profile-container">
        <div id="loader" style="text-align: center;">Loading profile...</div>
        <div id="profile-content" style="display: none;">
            <div class="profile-header">
                <h1 id="user-name">Cycling Enthusiast</h1>
                <p id="user-email">email@example.com</p>
            </div>

            <div class="profile-info">
                <div class="info-item">
                    <span class="info-label">Account Status</span>
                    <span id="user-role" class="role-badge role-free">Free User</span>
                </div>
            </div>

            <div id="upgrade-section" class="upgrade-card" style="display: none;">
                <h3>Unlock Premium Access</h3>
                <p>Get exclusive articles, training plans, and gear reviews.</p>
                <a href="subscribe.html" class="btn-primary" style="display: inline-block; margin-top: 15px;">Upgrade Now</a>
            </div>

            <div id="admin-section" class="upgrade-card" style="display: none; border-color: #ff4d4d;">
                <h3 style="color: #ff4d4d;">Admin Panel</h3>
                <p>Welcome, Administrator. You have full access to all site content.</p>
            </div>
        </div>
    </div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script>
        async function loadProfile() {
            const user = await velonowAuth.getCurrentUser();
            if (!user) {
                location.href = 'auth.html';
                return;
            }

            document.getElementById('loader').style.display = 'none';
            document.getElementById('profile-content').style.display = 'block';

            document.getElementById('user-name').textContent = user.profile?.full_name || 'Rider';
            document.getElementById('user-email').textContent = user.email;
            
            const role = user.profile?.role || 'free';
            const roleEl = document.getElementById('user-role');
            roleEl.textContent = role;
            roleEl.className = `role-badge role-${role}`;

            if (role === 'free') {
                document.getElementById('upgrade-section').style.display = 'block';
            } else if (role === 'admin') {
                document.getElementById('admin-section').style.display = 'block';
            }
        }

        document.addEventListener('DOMContentLoaded', loadProfile);
    </script>
</body>
</html>
